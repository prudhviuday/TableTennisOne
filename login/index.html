<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · SpinCraft</title><style>:root{--o:#f47b51;--od:#b9412d;--c:#fff8f3;--i:#262321;--m:#756b67;--l:#eaded8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#fff8f3,#f7c2aa);color:var(--i);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 30px));background:#fff;border:1px solid var(--l);border-radius:20px;padding:32px;box-shadow:0 28px 60px #793d2c1c;animation:pop .65s both}.brand{font-size:23px;font-weight:900;letter-spacing:-.06em;text-align:center}.brand i{display:inline-block;width:30px;height:30px;background:var(--o);border-radius:50%;vertical-align:middle;margin-right:9px}.brand span{color:var(--od)}.eyebrow{text-align:center;text-transform:uppercase;color:var(--od);font-weight:900;letter-spacing:.16em;font-size:11px;margin-top:34px}h1{text-align:center;font-size:33px;letter-spacing:-.07em;margin:10px 0}.muted{text-align:center;font-size:13px;color:var(--m);line-height:1.5}.field{margin-top:18px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid var(--l);border-radius:8px;padding:13px}.btn{width:100%;border:0;background:var(--o);color:#fff;padding:13px;border-radius:8px;font-weight:800;margin-top:22px;cursor:pointer}.back{text-align:center;display:block;margin-top:22px;color:var(--od);font-size:13px;font-weight:800;text-decoration:none}@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}</style></head><body><main class="card"><a href="/" class="brand"><i></i>spin<span>craft</span></a><div class="eyebrow">Welcome back</div><h1>Log in to your game.</h1><p class="muted">Save your custom builds and keep every match-day essential close.</p><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="••••••••"></div><button class="btn" id="submit">Continue</button><a class="back" href="/">← Back to SpinCraft</a></main><script>document.querySelector('#submit').onclick=()=>{document.querySelector('#submit').textContent='You’re in';document.querySelector('#submit').style.background='#386c55'}</script></body></html>
